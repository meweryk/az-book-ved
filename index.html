ня Макошь управляет Чертогом Небесного  Лебедя во Сварожьем Круге. Поэтому Богиню  Макошь очень часто изображают в виде Белой  Лебедушки, плывущей по безкрайнему Морю-  Океану, т.е. в Небесах. В честь Мудрой Небесной  Богородицы Славяне и Арии ставили Великие  Куммирни и Капища, ибо Богиня Макошь  олицетворяла не только судьбу, удачу, достаток в  Славянских Родах, соблюдающих Законы и  заповеди Древних Светлых Богов, к ней также  обращались люди с просьбой приумножить их  Древний Род, т.е. просили побольше детей, внуков  и правнуков.; Макошь (Мако- ша, Магощь) - богиня земной стихии. Корни «мА» (мать) и «кош» (судьба) можно прочесть как «мать судьбы». А кто или что, кроме Земли, может полностью определять нашу судь­ бу (жизнь)? С корнем «кош» есть слово в украинском языке «кошик» - корзина по-русски, что означает вместилище для материальных объектов, место для хранения и транспорти­ ровки. Матерью такого вместилища есть Макоша, она мате­ риализует, порождает все материальные объекты, рождаю­ щиеся в коше, или на Земле, и в зависимости от принятой материальной формы они получают определённую судьбу или, другими словами, занимают своё место, нишу. Она помо­ гает материализовать, проявлять мысль любого человека, лю­ бого живого существа. Окружающая нас реальность - резуль­ тат материализации наших мыслей. Если вы хотите проявить нужные вам события, славьте Богиню Макошь, и она наделит вас способностью к материализации.; Слава Богине МАГОЩИ. Слава Магощи благохвальныа! Коя могуществие даруе И веригой ведёт по стезе. Яко чюдотворныя твоя Положении Суть мощи. Она святость и оудержание наше, Тако всевиньныа милостьлива И боготвориыа есмь. Магоще! Вми призывающим тя! Славна и триславна буде! Владати на волю, И благость дажди, боговидьньство яви! Прави на всеми тще и зародно Тако бытьм! Тако есьм! Тако буди!; Слава Магощи, лелеющей блага земные! Она могущество дарует и утверждает нас на пути исконном, ибо величие её в мощи силы чудотворной. Святость духа в творениях своих уд <script>
  // Service Worker реєстрація (динамічний шлях, автооновлення)
  if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const basePath = window.location.pathname.replace(/\/[^/]*$/, '');
    
    navigator.serviceWorker.register(`${basePath}/service-worker.js`, {
      scope: `${basePath}/`
    }).then(reg => {
      console.log('SW registered:', reg);
      
      setInterval(() => reg.update(), 5 * 60 * 1000);
      
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            if (confirm('Доступна нова версія додатку. Оновити?')) {
              window.location.reload();
            }
          }
        });
      });
    }).catch(err => console.log('SW registration failed:', err));
  });
}// Мобільне меню (код залишається без змін)
  const menuToggle = document.getElementById('menuToggle');
  const navContainer = document.getElementById('navContainer');
  const navOverlay = document.getElementById('navOverlay');
  
  function closeMenu() {
    navContainer.classList.remove('open');
    navOverlay.classList.remove('open');
  }
  
  function openMenu() {
    navContainer.classList.add('open');
    navOverlay.classList.add('open');
  }
  
  if (menuToggle) {
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (navContainer.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
  }
  
  if (navOverlay) {
    navOverlay.addEventListener('click', closeMenu);
  }
  
  document.querySelectorAll('.nav-btn, .nav-link-external').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeout(closeMenu, 150);
    });
  });
  
  window.addEventListener('resize', () => {

  });
</script>
